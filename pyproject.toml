[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drake-display"
version = "0.1.0"
description = "Composable scalar field library and the Phase 0 habitability-veil pipeline."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
render = ["matplotlib>=3.9"]
phase0 = ["pandas>=2.2", "astropy>=6.1", "scipy>=1.13", "plotly>=5.24", "matplotlib>=3.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/fields", "src/veil"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
